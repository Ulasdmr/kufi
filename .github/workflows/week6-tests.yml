name: Week 6 - Kufi unit and integration tests
on:
  push:
    branches: [main, week6-testing]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all Week 6 tests (H2 test profile)
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
