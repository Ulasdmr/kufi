services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kufi_db
      POSTGRES_USER: kufi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - kufi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kufi -d kufi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kufi_pgdata:
