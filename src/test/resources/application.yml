spring:
  datasource:
    url: jdbc:h2:mem:kufitest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  jwt:
    secret: TestOnlyLocalKufiJwtSecretMustBeAtLeastThirtyTwoCharactersLong12345
    expiration-minutes: 60
